version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: konnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-konnect_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-konnect_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    container_name: konnect_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_ENGINE=django.db.backends.postgresql
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
