components:
  schemas:
    AdminProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        department:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
    AdminProfileRequest:
      type: object
      properties:
        department:
          type: string
          minLength: 1
          maxLength: 100
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
        author:
          type: string
          format: uuid
          readOnly: true
        author_name:
          type: string
          readOnly: true
        class_room:
          type: string
          format: uuid
          nullable: true
          description: Leave empty for global platform-wide announcement
        class_title:
          type: string
          readOnly: true
        priority:
          $ref: '#/components/schemas/AnnouncementPriorityEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - author_name
      - class_title
      - content
      - created_at
      - id
      - title
    AnnouncementPriorityEnum:
      enum:
      - NORMAL
      - URGENT
      type: string
      description: |-
        * `NORMAL` - Normal
        * `URGENT` - Urgent
    AnnouncementRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        class_room:
          type: string
          format: uuid
          nullable: true
          description: Leave empty for global platform-wide announcement
        priority:
          $ref: '#/components/schemas/AnnouncementPriorityEnum'
      required:
      - content
      - title
    AssessmentCreateUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        class_room:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        description:
          type: string
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        max_score:
