openapi: 3.0.3
info:
  title: KONNECT - Virtual Classroom API
  version: 1.0.0
  description: 'Comprehensive REST API for the KONNECT Virtual Classroom platform.
    Includes full feature sets for Admin, Teacher, and Learner user flows: Authentication,
    Class Management, Live Sessions & Attendance, Assessments (Exams, Quizzes, Exercises),
    Student Management & Flags, Collaboration (Study Groups, Study Plans), Communication,
    and Analytics.'
paths:
  /api/analytics/admin/platform-health/:
    get:
      operationId: analytics_admin_platform_health_retrieve
      description: |-
        Admin flow: System Settings -> Platform Health
        Performs real-time diagnostics on Database, API latency, and returns platform health.
      tags:
      - analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/admin/reports-analytics/:
    get:
      operationId: analytics_admin_reports_analytics_retrieve
      description: |-
        Admin flow: Reports & Analytics
        High-level platform engagement and growth metrics.
      tags:
      - analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/teacher/reports-analytics/:
    get:
      operationId: analytics_teacher_reports_analytics_retrieve
      description: |-
        Teacher flow: Report & Analytics
        Teacher's classes, average grades, student attendance rates.
      tags:
      - analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/assessments/{assessment_id}/submissions/:
    get:
      operationId: assessments_submissions_list
      description: 'Teacher flow: Student Management -> View learner submissions for
        an assessment'
      parameters:
      - in: path
        name: assessment_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - assessments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssessmentSubmissionDetailList'
          description: ''
  /api/assessments/{id}/:
    get:
      operationId: assessments_retrieve
      description: |-
        Learner flow: Take Exam / Answer Quiz
        Teacher flow: Edit Exam / Quiz
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDetail'
          description: ''
    put:
      operationId: assessments_update
      description: |-
        Learner flow: Take Exam / Answer Quiz
        Teacher flow: Edit Exam / Quiz
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssessmentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssessmentCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentCreateUpdate'
          description: ''
    patch:
      operationId: assessments_partial_update
      description: |-
        Learner flow: Take Exam / Answer Quiz
        Teacher flow: Edit Exam / Quiz
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssessmentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssessmentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssessmentCreateUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentCreateUpdate'
          description: ''
    delete:
      operationId: assessments_destroy
      description: |-
        Learner flow: Take Exam / Answer Quiz
        Teacher flow: Edit Exam / Quiz
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/assessments/{id}/submit/:
    post:
      operationId: assessments_submit_create
      description: |-
        Learner flow: Live Classroom -> Answer Quiz / Take Exam or Assignment submit.
        Supports auto-grading for multiple choice and true/false questions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/assessments/class/{class_id}/:
    get:
      operationId: assessments_class_list
      description: |-
        Teacher flow: Assignments -> Create Exam, Create Quiz, Exercise
        Learner flow: View class assignments
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - assessments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssessmentListList'
          description: ''
    post:
      operationId: assessments_class_create
      description: |-
        Teacher flow: Assignments -> Create Exam, Create Quiz, Exercise
        Learner flow: View class assignments
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssessmentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssessmentCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentCreateUpdate'
          description: ''
  /api/assessments/learner/my-submissions/:
    get:
      operationId: assessments_learner_my_submissions_list
      description: 'Learner flow: Progress & Grades -> View assignment & quiz submissions'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - assessments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssessmentSubmissionDetailList'
          description: ''
  /api/assessments/submissions/{id}/grade/:
    post:
      operationId: assessments_submissions_grade_create
      description: 'Teacher flow: Student Management -> Grade submission and provide
        feedback'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/admin/audit-logs/:
    get:
      operationId: auth_admin_audit_logs_list
      description: 'Admin user flow: Admin Dashboard -> Audit logs'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/auth/admin/teachers/verifications/:
    get:
      operationId: auth_admin_teachers_verifications_list
      description: 'Admin user flow: Manage Teachers -> Teacher verification'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeacherProfileList'
          description: ''
  /api/auth/admin/teachers/verifications/{id}/verify/:
    post:
      operationId: auth_admin_teachers_verifications_verify_create
      description: 'Admin user flow: Approve or Reject a teacher''s verification'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/me/learner-profile/:
    get:
      operationId: auth_me_learner_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfile'
          description: ''
    put:
      operationId: auth_me_learner_profile_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LearnerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LearnerProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfile'
          description: ''
    patch:
      operationId: auth_me_learner_profile_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLearnerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLearnerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLearnerProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfile'
          description: ''
  /api/auth/me/teacher-profile/:
    get:
      operationId: auth_me_teacher_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherProfile'
          description: ''
    put:
      operationId: auth_me_teacher_profile_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeacherProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeacherProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherProfile'
          description: ''
    patch:
      operationId: auth_me_teacher_profile_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTeacherProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTeacherProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTeacherProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherProfile'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/classes/{id}/:
    get:
      operationId: classes_retrieve
      description: Retrieve single classroom details.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - classes
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRoomDetail'
          description: ''
  /api/classes/admin/all-classes/:
    get:
      operationId: classes_admin_all_classes_list
      description: 'Admin flow: Manage Classes (Visibility, Class limits, system-wide
        class overview)'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - classes
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassRoomListList'
          description: ''
    post:
      operationId: classes_admin_all_classes_create
      description: 'Admin flow: Manage Classes (Visibility, Class limits, system-wide
        class overview)'
      tags:
      - classes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassRoomCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassRoomCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassRoomCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRoomCreateUpdate'
          description: ''
  /api/classes/browse/:
    get:
      operationId: classes_browse_list
      description: |-
        Learner / Public flow: Browse Classes
        Lists active and public classes with optional search and subject filtering.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - classes
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassRoomListList'
          description: ''
  /api/classes/learner/enroll/{class_id}/:
    post:
      operationId: classes_learner_enroll_create
      description: |-
        Learner flow: Join a class by class ID.
        If public and not full, automatically enrolls.
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - classes
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/classes/learner/join-by-code/:
    post:
      operationId: classes_learner_join_by_code_create
      description: 'Learner flow: Join class using join/enrollment code (Private or
        Public class).'
      tags:
      - classes
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/classes/learner/my-classes/:
    get:
      operationId: classes_learner_my_classes_list
      description: 'Learner user flow: My Classes (List of classes currently enrolled
        in)'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - classes
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnrollmentList'
          description: ''
  /api/classes/ratings/submit/:
    post:
      operationId: classes_ratings_submit_create
      description: 'Learner flow: Post-Class Ratings & Reviews'
      tags:
      - classes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassRatingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassRatingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassRatingRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRating'
          description: ''
  /api/classes/teacher/my-classes/:
    get:
      operationId: classes_teacher_my_classes_list
      description: 'Teacher flow: My Classes -> Create/Manage Classes (Class Visibility,
        Class Limit)'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - classes
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassRoomListList'
          description: ''
    post:
      operationId: classes_teacher_my_classes_create
      description: 'Teacher flow: My Classes -> Create/Manage Classes (Class Visibility,
        Class Limit)'
      tags:
      - classes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassRoomCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassRoomCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassRoomCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRoomCreateUpdate'
          description: ''
  /api/classes/teacher/my-classes/{id}/:
    get:
      operationId: classes_teacher_my_classes_retrieve
      description: 'Teacher flow: Edit / Update / Delete class'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - classes
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRoomCreateUpdate'
          description: ''
    put:
      operationId: classes_teacher_my_classes_update
      description: 'Teacher flow: Edit / Update / Delete class'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
